<!DOCTYPE html>
<html lang="sq"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kuiz 1 – Teoria e Kodeve</title>
<style>
:root{--bg:#f6f7fb;--card:#fff;--tx:#1b1f2a;--mut:#5b6170;--acc:#3b5bdb;--ok:#2b8a3e;--bad:#c92a2a;--bd:#e3e6ef;--okbg:#e6f6ea;--badbg:#fdeaea;--accbg:#eef1fd}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1c1f28;--tx:#e8eaf0;--mut:#9aa1b2;--acc:#7b93ff;--ok:#5fcf7a;--bad:#ff7b7b;--bd:#2c3040;--okbg:#17301f;--badbg:#3a1c1c;--accbg:#22273a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:820px;margin:0 auto;padding:24px 16px 60px}
a{color:var(--acc)}h1{font-size:1.5rem;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 18px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.bar{height:8px;background:var(--bd);border-radius:6px;overflow:hidden;margin-bottom:18px}.bar>div{height:100%;background:var(--acc);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:22px;box-shadow:0 2px 10px rgba(0,0,0,.04)}
.q{font-size:1.1rem;font-weight:600;margin:0 0 16px;white-space:pre-wrap}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:2px solid var(--bd);color:var(--tx);border-radius:10px;padding:12px 14px;margin:8px 0;font:inherit;cursor:pointer}
.opt:hover{border-color:var(--acc)}.opt.sel{border-color:var(--acc);background:var(--accbg)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}
input.ans{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx)}
input.ans:focus{outline:none;border-color:var(--acc)}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 18px;font:inherit;font-weight:600;cursor:pointer;margin-top:14px}
.btn.sec{background:transparent;color:var(--acc);border:2px solid var(--acc)}
.fb{margin-top:16px;padding:14px;border-radius:10px;border-left:5px solid;white-space:pre-wrap}
.fb.ok{background:var(--okbg);border-color:var(--ok)}.fb.bad{background:var(--badbg);border-color:var(--bad)}
.meta{color:var(--mut);font-size:.9rem}.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--acc)}
.res h2{margin:0 0 8px}.big{font-size:3rem;font-weight:800;color:var(--acc);margin:6px 0}
.list{margin:14px 0 0;padding:0;list-style:none}.list li{padding:10px 12px;border-top:1px solid var(--bd);white-space:pre-wrap}
.list li.bad{background:var(--badbg)}.tag{display:inline-block;font-size:.75rem;padding:2px 8px;border-radius:999px;background:var(--accbg);color:var(--acc);margin-right:6px}
.row{display:flex;gap:10px;flex-wrap:wrap}
</style></head><body><div class="wrap">
<div class="top"><div><h1>Kuiz 1 – Teoria e Kodeve</h1><p class="sub">Hamming, G/H, grupi standard, kodet ciklike · Det. 1–2 · 20 pyetje</p></div><div class="meta"><a href="index.html">← Kuizet</a></div></div>
<div class="top"><span class="meta" id="prog"></span><span class="timer" id="timer"></span></div>
<div class="bar"><div id="barfill"></div></div>
<div class="card" id="card"></div>
</div>
<script>
const QS = [{"t": "mc", "q": "Sa është largesa e Hammingut d(1101, 1011)?", "opts": ["1", "2", "3", "4"], "a": 1, "e": "Ndryshojnë në pozicionin 2 dhe 3 → d = 2."}, {"t": "mc", "q": "Kodi C = {00000, 00111, 11111}. Sa është d(C)?", "opts": ["2", "3", "5", "1"], "a": 0, "e": "d(00000,00111)=3, d(00000,11111)=5, d(00111,11111)=2 → minimumi 2."}, {"t": "mc", "q": "Një kod me largesë minimale d = 3 mund të…", "opts": ["zbulojë 3 dhe korrigjojë 1 gabim", "zbulojë 2 dhe korrigjojë 1 gabim", "zbulojë 1 dhe korrigjojë 0 gabime", "zbulojë 2 dhe korrigjojë 2 gabime"], "a": 1, "e": "Zbulon d−1 = 2, korrigjon ⌊(d−1)/2⌋ = 1."}, {"t": "txt", "q": "G = [[1,0,1,1],[0,1,0,0]]. Fjalëkodi për mesazhin m = 11 është:", "a": ["1111"], "e": "1011 + 0100 = 1111 (mod 2)."}, {"t": "mc", "q": "Për kod linear, d(C) është e barabartë me:", "opts": ["numrin e fjalëkodeve", "peshën minimale të një fjalëkodi jo-zero", "gjatësinë n minus k", "peshën e fjalëkodit më të gjatë"], "a": 1, "e": "Sepse d(x,y) = w(x+y) dhe x+y është përsëri fjalëkod."}, {"t": "mc", "q": "Nëse G = [I_k | P], atëherë matrica e kontrollit H është:", "opts": ["[I | P]", "[P | I]", "[Pᵀ | I_{n−k}]", "[I_{n−k} | P]"], "a": 2, "e": "H = [Pᵀ | I] garanton G·Hᵀ = P + P = 0."}, {"t": "txt", "q": "Kodi Hamming [7,4] me G sistematike (p₁=m₁+m₂+m₄, p₂=m₁+m₃+m₄, p₃=m₂+m₃+m₄). Fjalëkodi i m = 0110 është:", "a": ["0110110"], "e": "p₁ = 0+1+0 = 1, p₂ = 0+1+0 = 1, p₃ = 1+1+0 = 0 → 0110110."}, {"t": "txt", "q": "Kodi Hamming [7,4] sistematik. Fjalëkodi i m = 1011 është:", "a": ["1011010"], "e": "p₁ = 1+0+1 = 0, p₂ = 1+1+1 = 1, p₃ = 0+1+1 = 0 → 1011010."}, {"t": "mc", "q": "Sa fjalëkode ka kodi Hamming C[7,4]?", "opts": ["7", "8", "16", "128"], "a": 2, "e": "2ᵏ = 2⁴ = 16."}, {"t": "mc", "q": "Kolonat e matricës H të kodit Hamming [7,4] janë:", "opts": ["të gjithë vektorët 3-bitësh", "të gjithë vektorët jo-zero 3-bitësh", "vetëm vektorët me peshë 1", "rreshtat e G"], "a": 1, "e": "7 vektorë jo-zero me gjatësi 3 → 7 kolona."}, {"t": "mc", "q": "Sindroma s = H·rᵀ del jo-zero dhe e barabartë me kolonën 5 të H. Çka do të thotë?", "opts": ["ka 5 gabime", "gabimi është në bitin 5", "fjalëkodi është i saktë", "mesazhi është 5"], "a": 1, "e": "Sindroma e gabimit e = xⁱ është kolona i e H."}, {"t": "txt", "q": "C = {0000, 1011, 0100, 1111}. Pranohet r = 1110. Në grupin standard, r është në klasën me udhëheqës 0001. Fjalëkodi i korrigjuar është:", "a": ["1111"], "e": "c = r + e = 1110 + 0001 = 1111."}, {"t": "mc", "q": "Në grupin standard (standard array), udhëheqësi i çdo klase zgjidhet si:", "opts": ["fjalëkodi i parë i C", "vektori me peshë më të vogël në klasë", "vektori me peshë më të madhe", "çfarëdo vektori"], "a": 1, "e": "Udhëheqësi = gabimi më i mundshëm = më pak bita të ndryshuar."}, {"t": "mc", "q": "Fjalëkodi 1001 (biti i parë = koeficienti i x⁰) si polinom është:", "opts": ["x + x²", "1 + x³", "x³", "1 + x"], "a": 1, "e": "c₀ = 1, c₃ = 1 → 1 + x³."}, {"t": "mc", "q": "Mod 2: (1 + x³)(1 + x + x³) = ?", "opts": ["1 + x + x⁴ + x⁶", "1 + x + 2x³ + x⁴ + x⁶", "1 + x + x³ + x⁶", "x + x⁴ + x⁶"], "a": 0, "e": "1 + x + x³ + x³ + x⁴ + x⁶; x³ + x³ = 0."}, {"t": "mc", "q": "Pranohet r(x), pjesëtohet me g(x) dhe mbetja është 0. Çka përfundon?", "opts": ["ka gabim, korrigjohet me sindromën", "nuk ka gabim të zbuluar; mesazhi = herësi", "nuk ka gabim; mesazhi = mbetja", "kodi nuk vlen"], "a": 1, "e": "r(x) = q(x)g(x) → r është fjalëkod, m(x) = q(x)."}, {"t": "mc", "q": "Cili polinom është gjenerues i VLEFSHËM për një kod ciklik C[7,4]?", "opts": ["1 + x³", "x³ + x + 1", "x² + 1", "x³ + x² + x + 1"], "a": 1, "e": "Duhet të pjesëtojë x⁷+1 = (x+1)(x³+x+1)(x³+x²+1) dhe të ketë shkallë 3."}, {"t": "mc", "q": "r = 1110011 me g(x) = x³+x²+x+1. r(x) = 1+x+x²+x⁵+x⁶. Mbetja e pjesëtimit është:", "opts": ["0", "1", "x + 1", "x²"], "a": 1, "e": "x³·g = x⁶+x⁵+x⁴+x³ → mbetet x⁴+x³+x²+x+1; x·g = x⁴+x³+x²+x → mbetet 1. Gabim!"}, {"t": "mc", "q": "Shkalla e kodit Hamming [7,4] është:", "opts": ["7/4", "3/7", "4/7", "1/7"], "a": 2, "e": "k/n = 4/7."}, {"t": "mc", "q": "Cili nga këto NUK është veti e largesës Hamming?", "opts": ["d(x,y) = d(y,x)", "d(x,y) ≤ d(x,z) + d(z,y)", "d(x,x) = 0", "d(x,y) = w(x)·w(y)"], "a": 3, "e": "Për kode binare d(x,y) = w(x+y), jo produkt i peshave."}];
const TIMER_MIN = 0;
let order = [...QS.keys()];
let i = 0, score = 0, answers = [], sel = null, locked = false, tStart = Date.now(), tInt = null;
const card = document.getElementById('card');
function norm(s){ return String(s).toLowerCase().replace(/\s+/g,'').replace(/−/g,'-').replace(/,/g,',').replace(/\.$/,''); }
function numOf(s){ return parseFloat(String(s).replace(/\s+/g,'').replace(',', '.').replace('−','-')); }
function shuffle(){ for(let k=order.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[order[k],order[j]]=[order[j],order[k]];} }
function fmt(sec){ const m=Math.floor(sec/60), s=sec%60; return m+':'+String(s).padStart(2,'0'); }
function tick(){ const el=document.getElementById('timer'); const gone=Math.floor((Date.now()-tStart)/1000);
  if(TIMER_MIN>0){ const left=TIMER_MIN*60-gone; el.textContent='⏱ '+fmt(Math.max(0,left)); if(left<=0){clearInterval(tInt); finish();} }
  else el.textContent='⏱ '+fmt(gone); }
function render(){
  if(i>=order.length){ finish(); return; }
  const q = QS[order[i]]; sel=null; locked=false;
  document.getElementById('prog').textContent = 'Pyetja '+(i+1)+' / '+order.length+'  ·  Pikë: '+score;
  document.getElementById('barfill').style.width = (100*i/order.length)+'%';
  let h = '<p class="q">'+esc(q.q)+'</p>';
  if(q.t==='mc'){ q.opts.forEach((o,k)=>{ h+='<button class="opt" data-k="'+k+'">'+esc(o)+'</button>'; }); }
  else { h+='<input class="ans" id="ans" autocomplete="off" placeholder="'+(q.t==='num'?'Shkruaj numrin (p.sh. 0.347)':'Shkruaj përgjigjen')+'">'; }
  h+='<div class="row"><button class="btn" id="chk">Kontrollo</button><button class="btn sec" id="skip">Kalo</button></div><div id="fb"></div>';
  card.innerHTML = h;
  card.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{ if(locked) return; card.querySelectorAll('.opt').forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); sel=+b.dataset.k; });
  document.getElementById('chk').onclick = check;
  document.getElementById('skip').onclick = ()=>{ if(!locked){ answers.push({q, ok:false, given:'(kaluar)'}); } i++; render(); };
  const inp=document.getElementById('ans'); if(inp){ inp.focus(); inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ locked? (i++,render()) : check(); } }); }
}
function check(){
  if(locked){ i++; render(); return; }
  const q = QS[order[i]]; let ok=false, given='';
  if(q.t==='mc'){ if(sel===null) return; given=q.opts[sel]; ok = sel===q.a;
    card.querySelectorAll('.opt').forEach((b,k)=>{ if(k===q.a) b.classList.add('ok'); else if(k===sel) b.classList.add('bad'); }); }
  else { const v=document.getElementById('ans').value.trim(); if(!v) return; given=v;
    if(q.t==='num'){ const n=numOf(v); ok = !isNaN(n) && Math.abs(n-q.a) <= (q.tol||0.01); }
    else { ok = q.a.map(norm).includes(norm(v)); } }
  locked=true; if(ok) score++;
  answers.push({q, ok, given});
  const fb=document.getElementById('fb');
  fb.innerHTML = '<div class="fb '+(ok?'ok':'bad')+'"><b>'+(ok?'✔ Saktë!':'✘ Gabim.')+'</b> '+(q.t!=='mc'?'Përgjigja: <b>'+esc(Array.isArray(q.a)?q.a[0]:q.a)+'</b>. ':'')+esc(q.e||'')+'</div>';
  document.getElementById('chk').textContent='Vazhdo →'; document.getElementById('skip').style.display='none';
  document.getElementById('prog').textContent = 'Pyetja '+(i+1)+' / '+order.length+'  ·  Pikë: '+score;
}
function finish(){
  clearInterval(tInt);
  const pct=Math.round(100*score/order.length);
  let h='<div class="res"><h2>Rezultati</h2><div class="big">'+score+' / '+order.length+'</div><p class="meta">'+pct+'% · koha '+fmt(Math.floor((Date.now()-tStart)/1000))+'</p>';
  h+='<p>'+(pct>=85?'Shkëlqyeshëm – kjo temë është gati për provim.':pct>=65?'Mirë. Rishiko pyetjet e gabuara më poshtë dhe përsërite nesër.':'Kthehu te skedari i temës, lexoje edhe një herë, pastaj përsërite kuizin.')+'</p>';
  h+='<div class="row"><button class="btn" onclick="restart(false)">Përsërit</button><button class="btn sec" onclick="restart(true)">Përsërit (i përzier)</button></div>';
  h+='<ul class="list">'+answers.map((a,k)=>'<li class="'+(a.ok?'':'bad')+'"><span class="tag">'+(k+1)+'</span>'+(a.ok?'✔ ':'✘ ')+esc(a.q.q)+(a.ok?'':'\n   Ti: '+esc(a.given)+'  |  Saktë: '+esc(a.q.t==='mc'?a.q.opts[a.q.a]:(Array.isArray(a.q.a)?a.q.a[0]:a.q.a))+'\n   '+esc(a.q.e||''))+'</li>').join('')+'</ul></div>';
  card.innerHTML=h; document.getElementById('barfill').style.width='100%';
  document.getElementById('prog').textContent='Përfunduar';
  try{ const key='sd2quiz:'+document.title; const best=JSON.parse(localStorage.getItem(key)||'null'); if(!best||score>best.score) localStorage.setItem(key,JSON.stringify({score,total:order.length,date:new Date().toISOString()})); }catch(e){}
}
function restart(sh){ i=0; score=0; answers=[]; order=[...QS.keys()]; if(sh) shuffle(); tStart=Date.now(); clearInterval(tInt); tInt=setInterval(tick,1000); tick(); render(); }
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
restart(false);
</script></body></html>
